[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "keiri-pdf-organizer"
version = "1.0.0"
description = "オフラインで動作する経理実務向けPDF整理ツール"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "pypdf>=5.0,<7", "PyMuPDF>=1.24,<2"]

[project.scripts]
keiri-pdf = "pdf_organizer.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

